<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Suprema - Selecione a Porta</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      text-align: center;
      max-width: 600px;
      padding: 20px;
    }
    h1 {
      margin-bottom: 30px;
      font-size: 2em;
    }
    .subtitle {
      margin-bottom: 30px;
      opacity: 0.9;
    }
    .ports {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .port-link {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      text-decoration: none;
      color: white;
      transition: all 0.3s;
    }
    .port-link:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .port-icon {
      font-size: 2em;
    }
    .port-info {
      display: flex;
      flex-direction: column;
      text-align: left;
      gap: 5px;
      flex: 1;
    }
    .port-info strong {
      font-size: 1.2em;
    }
    .port-info span {
      font-size: 0.9em;
      opacity: 0.8;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 AI Suprema</h1>
    <p class="subtitle">Inteligência Artificial - Selecione a porta:</p>
    <div class="ports">
      
      <!-- PORT:3001 -->https://fresh-papers-think.loca.lt
      <a href="https://fresh-papers-think.loca.lt" class="port-link" data-port="3001">
        <div class="port-icon">🚀</div>
        <div class="port-info">
          <strong>Porta 3001</strong>
          <span>https://fresh-papers-think.loca.lt</span>
        </div>
      </a>
      <!-- PORT:5173 -->https://nervous-lionfish-18.loca.lt
      <a href="https://nervous-lionfish-18.loca.lt" class="port-link" data-port="5173">
        <div class="port-icon">🚀</div>
        <div class="port-info">
          <strong>Porta 5173</strong>
          <span>https://nervous-lionfish-18.loca.lt</span>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
